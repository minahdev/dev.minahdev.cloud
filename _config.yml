# 사이트 이름과 소개. 상단 바와 표지, RSS 에 쓰인다.
title: 개발 로그
tagline: 김민아
description: >-
  만들면서 겪은 것을 그때그때 적는다.
  무엇이 잘못됐고 무엇을 골랐는지, 근거와 함께.

author: 김민아
github_username: minahdev

# 커스텀 도메인 dev.minahdev.cloud 로 서빙한다.
# DNS(CNAME dev → minahdev.github.io, 프록시 끔)와 Pages 커스텀 도메인을 먼저 붙인 뒤에
# 첫 push 를 해야 한 번도 깨지지 않는다. 도메인을 바꾸려면 여기와 루트의 CNAME 파일 둘 다 고친다.
baseurl: ""
url: "https://dev.minahdev.cloud"

permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# 프로젝트. 글의 front matter 에 project: Pace 처럼 적으면 그 프로젝트로 묶인다.
# 현관(/)의 카드, 좌측 색인의 묶음, 각 프로젝트 로그 페이지가 전부 여기서 나온다.
#
# 새 프로젝트를 시작하면:
#   1. 여기에 항목 하나 추가 (log 는 만들 페이지의 permalink)
#   2. 루트에 <이름>.md 를 만들고 layout: project · project_name · permalink 세 줄
#   3. 글에 project: <이름> 을 적는다
projects:
  - name: Pace
    blurb: 개인 프로젝트 · 혼자
    # TODO: 이 한 줄은 Pace 가 무엇인지 직접 적어 주세요 — 커밋만 보고 짐작해 쓰지 않았습니다.
    desc: FastAPI · Next.js · Flutter 를 한 저장소에서 굴리는 모노레포.
    log: /pace/
    url: https://pace.minahdev.cloud
  - name: Arda
    blurb: 팀 프로젝트 · 4인
    desc: AI 채용 자동화 플랫폼. 프론트엔드와 앱 두 도메인을 맡았다.
    period: 2026. 08. 20. ~ 09. 18. 코드 프리즈
    log: /arda/
    report: https://ats.minahdev.cloud

nav:
  - title: 현관
    url: /
  - title: 태그
    url: /tags/
  - title: 소개
    url: /about/

links:
  - title: GitHub
    url: https://github.com/minahdev

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - README.md
  - CLAUDE.md
